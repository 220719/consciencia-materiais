name: Manter Streamlit Cloud acordado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Aquecer materiais-matferrce.streamlit.app
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            https://materiais-matferrce.streamlit.app/_stcore/health
