name: Backup semanal do banco

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install supabase

      - name: Rodar backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backup.py

      - name: Clonar repositorio privado de backups
        uses: actions/checkout@v4
        with:
          repository: 220719/consciencia-materiais-backups
          path: repo-backups
          ssh-key: ${{ secrets.BACKUP_SSH_KEY }}

      - name: Copiar e enviar backup
        working-directory: repo-backups
        run: |
          cp -r ../backups/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: backup automatico $(date -I)"
          git push
