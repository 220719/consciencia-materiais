name: Backup semanal do banco

on:
  schedule:
    - cron: "0 6 * * 1"  # toda segunda-feira as 06:00 UTC (03:00 em Brasilia)
  workflow_dispatch:  # permite rodar manualmente pelo botao no GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install supabase

      - name: Rodar backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backup.py

      - name: Commitar backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "chore: backup automatico $(date -I)"
          git push
